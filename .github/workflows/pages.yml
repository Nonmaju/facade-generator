# Deploys the web/ folder to GitHub Pages.
# Manual only on purpose: enabling Pages and the first deploy are the owner's decision (Settings -> Pages -> Source: "GitHub Actions").
# After the owner enabled Pages and one manual run is green, add "push: branches: [main]" under "on:" if every merge should deploy.
# Do NOT add "enablement: true" to configure-pages: that would switch Pages on by itself.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
