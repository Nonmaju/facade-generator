# Deploys the web/ folder to GitHub Pages.
# Every push to main deploys (the owner asked for this once the first manual run succeeded, 2026-10-16); it can also be started by hand.
# The tests run first, so a red test blocks the deploy. Pull requests and timers never deploy.
# Do NOT add "enablement: true" to configure-pages: that would switch Pages on by itself.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
