<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>파사드 스튜디오</title>
  <meta name="theme-color" content="#0e1114">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nonmaju.github.io/facade-studio/">
  <meta property="og:image" content="https://nonmaju.github.io/facade-studio/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:title" content="파사드 스튜디오">
  <meta property="og:description" content="파라미터로 건물 파사드를 만들고 재질을 실시간으로 바꿔보는 브라우저 스튜디오. GPU 없이 브라우저에서만 동작합니다.">
  <meta name="description" content="파라미터로 건물 파사드를 만들고 재질을 실시간으로 바꿔보는 브라우저 스튜디오. GPU 없이 브라우저에서만 동작합니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="studio/studio.css">
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
    } }
  </script>
</head>
<body>
  <header class="bar">
    <div class="pill">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" rx="5" fill="#EDEFF1"/><g fill="#15181B"><rect x="6" y="6" width="5" height="5" rx="1"/><rect x="12" y="6" width="5" height="5" rx="1"/><rect x="18" y="6" width="5" height="5" rx="1"/><rect x="6" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/><rect x="18" y="12" width="5" height="5" rx="1"/><rect x="6" y="18" width="5" height="5" rx="1"/><rect x="12" y="18" width="5" height="5" rx="1"/></g><rect x="18" y="18" width="5" height="5" rx="1" fill="#FF6A3D"/></svg>
        <h1>파사드 스튜디오</h1>
      </div>
      <a class="link" href="https://github.com/Nonmaju/facade-studio#readme" target="_blank" rel="noopener">프로젝트 이야기</a>
    </div>
    <div class="bar-actions">
    <button id="controls-toggle" class="btn-ghost" type="button" aria-expanded="true" aria-controls="params-card">컨트롤 숨기기</button>
    <button id="edit-toggle" class="btn-ghost" type="button" aria-expanded="false" aria-controls="editor">규칙 편집</button>
    <button id="shot" class="btn-accent" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
      PNG 저장
    </button>
    </div>
  </header>

  <canvas id="view" role="img" aria-label="파사드 3D 미리보기. 드래그로 회전하고 휠로 확대합니다."></canvas>

  <div class="dock">
    <div id="types" class="seg seg-pill" role="group" aria-label="파사드 유형"></div>
    <div class="dock-sep" aria-hidden="true"></div>
    <div id="presets" class="chips" role="group" aria-label="프리셋"></div>
    <div class="dock-sep" aria-hidden="true"></div>
    <button id="random" class="btn-ghost" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg>
      랜덤
    </button>
  </div>

  <aside id="editor" class="card editor" aria-labelledby="editor-title" hidden>
    <div class="editor-head">
      <h2 id="editor-title">규칙 편집</h2>
      <span id="editor-status" class="editor-status"></span>
    </div>
    <textarea id="editor-text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="파사드 규칙 JSON" aria-describedby="editor-errors"></textarea>
    <ul id="editor-errors" class="editor-errors" hidden></ul>
    <div class="editor-actions">
      <button id="editor-reset" class="btn-ghost" type="button">원래대로</button>
      <button id="editor-copy" class="btn-ghost" type="button">JSON 복사</button>
    </div>
  </aside>

  <p id="status" class="chip"></p>
  <p id="announce" class="sr-only" role="status"></p>

  <div class="side">
    <section id="params-card" class="card params" aria-labelledby="params-title">
      <div class="card-head">
        <h2 id="params-title">파라미터</h2>
        <button id="params-close" class="card-close" type="button" aria-label="컨트롤 닫기">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="controls"></div>
    </section>
    <section class="card finishes" aria-label="재질">
      <div id="finish-primary" class="finish"></div>
      <div id="finish-secondary" class="finish"></div>
    </section>
  </div>

  <p id="fallback" class="notice" role="alert" hidden>이 브라우저에서는 WebGL을 사용할 수 없어 3D 미리보기를 표시할 수 없습니다. 다른 브라우저에서 열어보세요.</p>

  <p id="load-error" class="notice" role="alert" hidden>화면을 불러오지 못했습니다. 새로고침해 보세요. 계속 안 되면 브라우저를 최신 버전으로 업데이트하거나 다른 브라우저에서 열어보세요.</p>

  <script type="module" src="studio/app.js"></script>
  <script>
    // Classic script on purpose: it still runs when the module graph (three.js from the CDN) fails to load.
    setTimeout(function () {
      if (!document.documentElement.dataset.ready) document.getElementById("load-error").hidden = false;
    }, 10000);
  </script>
</body>
</html>
