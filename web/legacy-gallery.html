<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Facade Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Facade Generator</h1>
    <p>스케치 한 장으로 여러 재질의 외관 렌더를 한눈에 비교합니다.</p>
  </header>
  <main>
    <section id="panel">
      <h2>1. 스케치</h2>
      <div id="sketches"></div>
      <label class="upload">내 스케치 올리기 (라이브 모드 전용)
        <input type="file" id="upload" accept="image/*" disabled>
      </label>
      <h2>2. 재질</h2>
      <div id="materials"></div>
      <h2>3. 추가 설명</h2>
      <textarea id="extra" rows="2" placeholder="예: 해질녘, 숲속 단독주택"></textarea>
      <button id="go">생성</button>
      <p id="mode" class="hint"></p>
      <details>
        <summary>서버 설정</summary>
        <input id="server" placeholder="비워두면 데모 모드 (미리 생성된 결과)">
      </details>
    </section>
    <section id="results">
      <div id="toolbar"><button id="zip" hidden>전체 ZIP 저장</button></div>
      <div id="gallery"><p class="hint">스케치와 재질을 고르고 [생성]을 눌러보세요.</p></div>
    </section>
  </main>
  <dialog id="lightbox">
    <img alt="">
    <form method="dialog"><a id="dl">저장</a> <button>닫기</button></form>
  </dialog>
  <footer>
    스케치: villa_elev는 Rijksmuseum RP-T-1966-65-1 (CC0)의 일부, modern은 직접 제작.
    렌더: SDXL + ControlNet(Canny), CONTROL_SCALE 0.55.
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
